<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Standorte</title>

  <link
    href="https://unpkg.com/maplibre-gl@5.16.0/dist/maplibre-gl.css"
    rel="stylesheet"
  >

  <script src="https://unpkg.com/maplibre-gl@5.16.0/dist/maplibre-gl.js"></script>

  <style>

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont,
                   "Helvetica Neue", Arial, sans-serif;
      background: #f4f1eb;
    }

    #map {
      position: absolute;
      inset: 0;
      z-index: 1;
    }

    /* Suchfeld */

    .search-box {
      position: absolute;
      z-index: 1000;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);

      width: min(420px, calc(100% - 40px));

      background: rgba(250,248,243,.96);
      border: 1px solid rgba(166,143,101,.40);
      box-shadow: 0 10px 30px rgba(45,40,32,.14);

      display: flex;
      align-items: center;
    }

    #searchInput {
      width: 100%;
      border: none;
      outline: none;
      background: transparent;

      padding: 15px 18px;

      font-size: 14px;
      color: #37342f;
      letter-spacing: .2px;
    }

    #searchButton {
      border: none;
      border-left: 1px solid rgba(166,143,101,.25);
      background: transparent;

      padding: 15px 18px;
      cursor: pointer;

      color: #9c7f4e;
      font-size: 17px;
    }

    #searchButton:hover {
      background: rgba(190,163,111,.08);
    }

    /* Suchergebnisse */

    #results {
      position: absolute;
      z-index: 1001;

      top: 78px;
      left: 50%;
      transform: translateX(-50%);

      width: min(420px, calc(100% - 40px));

      background: rgba(250,248,243,.98);
      box-shadow: 0 12px 30px rgba(45,40,32,.16);

      display: none;
    }

    .result-item {
      padding: 12px 16px;
      border-bottom: 1px solid #e7e1d7;

      color: #4b4740;
      font-size: 13px;
      line-height: 1.4;

      cursor: pointer;
    }

    .result-item:hover {
      background: #f1ece3;
    }

    /* Goldener Standort */

    .luxury-marker {
      width: 14px;
      height: 14px;

      background: #b99a62;
      border: 2px solid #fffaf0;
      border-radius: 50%;

      box-shadow:
        0 0 0 6px rgba(185,154,98,.18),
        0 4px 14px rgba(0,0,0,.25);

      cursor: pointer;
    }

    /* Gefundene Adresse */

    .search-marker {
      width: 12px;
      height: 12px;

      background: #3e3b36;
      border: 3px solid #ffffff;
      border-radius: 50%;

      box-shadow: 0 3px 12px rgba(0,0,0,.28);
    }

    /* Popup */

    .maplibregl-popup-content {
      background: #faf8f3;
      color: #47433d;

      border: 1px solid rgba(185,154,98,.35);
      border-radius: 2px;

      padding: 17px 20px;

      box-shadow: 0 12px 28px rgba(0,0,0,.16);
    }

    .location-title {
      color: #9c7f4e;
      font-size: 13px;
      letter-spacing: 2px;
      margin-bottom: 7px;
    }

    .location-address {
      font-size: 13px;
      line-height: 1.6;
    }

    /* Kartensteuerung */

    .maplibregl-ctrl-group {
      background: rgba(250,248,243,.95) !important;
      border: 1px solid rgba(185,154,98,.30);
      box-shadow: 0 5px 18px rgba(0,0,0,.12) !important;
    }

  </style>
</head>

<body>

  <div id="map"></div>

  <div class="search-box">
    <input
      id="searchInput"
      type="text"
      placeholder="Ort oder Adresse suchen …"
    >
    <button id="searchButton" aria-label="Suchen">⌕</button>
  </div>

  <div id="results"></div>


  <script>

    /*
      Helle Basiskarte
    */

    const map = new maplibregl.Map({
      container: 'map',

      style:
        'https://tiles.openfreemap.org/styles/liberty',

      center: [8.5417, 47.3769],
      zoom: 10.5
    });


    /*
      Navigation
    */

    map.addControl(
      new maplibregl.NavigationControl(),
      'top-right'
    );


    /*
      Aktuellen Standort anzeigen
    */

    map.addControl(
      new maplibregl.GeolocateControl({
        positionOptions: {
          enableHighAccuracy: true
        },
        trackUserLocation: false
      }),
      'top-right'
    );


/*
  Unsere festen Standorte in Cham
*/

const standorte = [
  {
    name: 'Fabrikstrasse 5',
    adresse: 'Fabrikstrasse 5, 6330 Cham',
    bild: 'Fabrikstrasse 5.jpeg',
    koordinaten: [8.45810603980665, 47.18514502110924]
  },
  {
    name: 'Portierhaus',
    adresse: 'Papieriplatz 2, 6330 Cham',
    bild: 'Portierhaus Papieriplatz 2.jpg',
    koordinaten: [8.45896341282276, 47.18558563679696]
  },
  {
    name: 'Kesselhaus',
    adresse: 'Papieriplatz 4, 6330 Cham',
    bild: 'Kesselhaus Papieriplatz 4.jpeg',
    koordinaten: [8.458113653298595, 47.18564062827952]
  }
];

let portierhausMarker = null;
standorte.forEach(standort => {

  const markerElement =
    document.createElement('div');

  markerElement.className =
    'luxury-marker';


  const aktuellerMarker = new maplibregl.Marker({
    element: markerElement
  })
    .setLngLat(standort.koordinaten)
   .setPopup(
  new maplibregl.Popup({
    offset: 18,
    closeButton: false,
    maxWidth: '240px'
  }).setHTML(`
    <div style="width:190px">

      <img
        src="${standort.bild}"
        alt="${standort.name}"
        style="
          width:190px;
          height:105px;
          object-fit:cover;
          display:block;
          margin-bottom:12px;
        "
      >

      <div
        class="location-title"
        style="
          font-size:12px;
          letter-spacing:1.6px;
          margin-bottom:5px;
        "
      >
        ${standort.name.toUpperCase()}
      </div>

      <div
        class="location-address"
        style="
          font-size:12px;
          line-height:1.5;
        "
      >
        ${standort.adresse}
      </div>

      <a
        <a
  href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(standort.adresse)}"
  target="_blank"
  rel="noopener noreferrer"
  onclick="event.stopPropagation();"
        style="
          display:inline-block;
          margin-top:10px;
          color:#9c7f4e;
          font-size:12px;
          text-decoration:none;
          letter-spacing:.3px;
        "
      >
        Route anzeigen →
      </a>

    </div>
  `)
)
.addTo(map);
if (standort.name === 'Portierhaus') {
  portierhausMarker = aktuellerMarker;
}
});


/*
  Karte auf die drei Standorte ausrichten
*/

const bounds =
  new maplibregl.LngLatBounds();

standorte.forEach(standort => {
  bounds.extend(standort.koordinaten);
});

map.fitBounds(bounds, {
  padding: 100,
  maxZoom: 16
});
/*
  Direktlink zu einem bestimmten Standort
*/

const urlParameter =
  new URLSearchParams(window.location.search);

const ort =
  urlParameter.get('ort');

if (ort === 'portierhaus' && portierhausMarker) {

  map.once('load', () => {

   map.flyTo({
  center: [8.45896341282276, 47.18558563679696],
  zoom: 16.5,
  offset: [0, 120]
});

    portierhausMarker.togglePopup();

  });

}
  
    /*
      Adresssuche
    */

    const searchInput =
      document.getElementById('searchInput');

    const searchButton =
      document.getElementById('searchButton');

    const resultsBox =
      document.getElementById('results');

    let searchMarker = null;


    async function searchLocation() {

      const query = searchInput.value.trim();

      if (!query) return;

      resultsBox.innerHTML =
        '<div class="result-item">Suche …</div>';

      resultsBox.style.display = 'block';


      try {

        const url =
          'https://nominatim.openstreetmap.org/search' +
          '?format=json' +
          '&limit=5' +
          '&countrycodes=ch' +
          '&q=' +
          encodeURIComponent(query);

        const response = await fetch(url);

        const results = await response.json();


        if (!results.length) {

          resultsBox.innerHTML =
            '<div class="result-item">Kein Standort gefunden.</div>';

          return;
        }


        resultsBox.innerHTML = '';


        results.forEach(place => {

          const item =
            document.createElement('div');

          item.className = 'result-item';

          item.textContent =
            place.display_name;


          item.addEventListener('click', () => {

            const lng =
              parseFloat(place.lon);

            const lat =
              parseFloat(place.lat);


            map.flyTo({
              center: [lng, lat],
              zoom: 15
            });


            if (searchMarker) {
              searchMarker.remove();
            }


            const el =
              document.createElement('div');

            el.className =
              'search-marker';


            searchMarker =
              new maplibregl.Marker({
                element: el
              })
                .setLngLat([lng, lat])
                .setPopup(
                  new maplibregl.Popup({
                    offset: 18
                  }).setText(
                    place.display_name
                  )
                )
                .addTo(map);


            searchMarker.togglePopup();

            resultsBox.style.display =
              'none';

            searchInput.value =
              place.display_name;

          });


          resultsBox.appendChild(item);

        });


      } catch (error) {

        resultsBox.innerHTML =
          '<div class="result-item">Die Suche konnte nicht geladen werden.</div>';

      }

    }


    searchButton.addEventListener(
      'click',
      searchLocation
    );


    searchInput.addEventListener(
      'keydown',
      event => {

        if (event.key === 'Enter') {
          searchLocation();
        }

      }
    );

  </script>

</body>
</html>
